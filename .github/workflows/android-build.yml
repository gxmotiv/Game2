name: Build Android Debug APK

on:
  push:
    branches: [kilo/airy-chime-uvv, fix/veil-circuit-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veil-circuit-android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3.stable"
  GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
  GODOT_TEMPLATES_URL: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
  ANDROID_SDK_VERSION: "11076708"
  ANDROID_SDK_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # No Gradle cache - this is a Godot project, not a Gradle project

      - name: Verify project files
        run: |
          ls -la project.godot export_presets.cfg
          ls -la assets/textures/icon.png

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget curl libfontconfig1 libx11-6 libxext6 libxrender1 libxi6 libxtst6 libgl1 libgl1-mesa-dri xvfb imagemagick

      - name: Download and install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q "${{ env.ANDROID_SDK_URL }}" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android licenses and install SDK packages
        run: |
          # Disable pipefail only for license acceptance to handle broken pipe from 'yes'
          set +o pipefail
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          LICENSE_EXIT=${PIPESTATUS[1]}
          set -o pipefail
          if [ $LICENSE_EXIT -ne 0 ]; then
            echo "ERROR: License acceptance failed with exit code $LICENSE_EXIT"
            exit 1
          fi
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Download Godot 4.3 stable
        run: |
          mkdir -p $HOME/godot
          cd $HOME/godot
          wget -q "${{ env.GODOT_URL }}" -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          echo "$HOME/godot" >> $GITHUB_PATH

      - name: Download and install Godot export templates
        run: |
          cd $HOME/godot
          wget -q "${{ env.GODOT_TEMPLATES_URL }}" -O templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz -d $HOME/.local/share/godot/export_templates/4.3.stable
          # Fix: tpz extracts to a "templates" subdirectory, move files up
          if [ -d "$HOME/.local/share/godot/export_templates/4.3.stable/templates" ]; then
            mv $HOME/.local/share/godot/export_templates/4.3.stable/templates/* $HOME/.local/share/godot/export_templates/4.3.stable/
            rmdir $HOME/.local/share/godot/export_templates/4.3.stable/templates
          fi
          # Verify required Android templates exist
          if [ ! -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk" ] || [ ! -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk" ]; then
            echo "ERROR: Required Android export templates not found"
            ls -la $HOME/.local/share/godot/export_templates/4.3.stable/
            exit 1
          fi
          echo "Export templates verified"

      - name: Configure Godot editor settings
        run: |
          mkdir -p $HOME/.config/godot
          # Use JAVA_HOME from setup-java (points to Temurin JDK)
          if [ -z "$JAVA_HOME" ] || [ ! -f "$JAVA_HOME/bin/java" ]; then
            echo "ERROR: JAVA_HOME not set or invalid"
            exit 1
          fi
          {
            echo '[gd_resource type="EditorSettings" load_steps=1 format=3]'
            echo ''
            echo '[resource]'
            echo 'export/android/adb = ""'
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/android_sdk_path = \"$HOME/android-sdk\""
            echo 'run/main_scene = "res://scenes/main/main.tscn"'
          } > $HOME/.config/godot/editor_settings-4.tres

      - name: Verify editor settings
        run: |
          cat $HOME/.config/godot/editor_settings-4.tres

      - name: Restore stable Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: veil-circuit-debug-keystore-v1-${{ runner.os }}

      - name: Prepare Android debug signing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Verify Android SDK paths
        run: |
          test -f "$HOME/android-sdk/platforms/android-34/android.jar"
          test -x "$HOME/android-sdk/build-tools/34.0.0/apksigner"
          test -f "$JAVA_HOME/bin/java"
          test -f "$HOME/.android/debug.keystore"

      - name: Validate Godot project and render a boot frame
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          ERROR_PATTERN='SCRIPT ERROR:|Parse Error|Cannot get class|Parent path .* vanished|ERROR: Failed loading|Invalid assignment of property|_create_mesh_array|NULL MESH INSTANCE|NO ACTIVE 3D CAMERA|PLAYER GROUP MISSING|STARTUP CHECK FAILED|Failed to retrieve non-existent singleton|valid InputEvent object|Unable to convert array index 0 from "int" to "RID"|Parameter "m" is null'

          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --editor --path "$GITHUB_WORKSPACE" --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "$ERROR_PATTERN" /tmp/godot-import.log; then
            echo "ERROR: Godot editor import reported scene/resource/script errors."
            exit 1
          fi

          mkdir -p build/android
          xvfb-run -a -s "-screen 0 1280x720x24" sh -c '
            set -eu
            export LIBGL_ALWAYS_SOFTWARE=1
            godot --audio-driver Dummy --path "$GITHUB_WORKSPACE" --quit-after 300 > /tmp/godot-boot.log 2>&1 &
            game_pid=$!
            sleep 2
            import -window root "$GITHUB_WORKSPACE/build/android/veil_circuit_boot.png"
            wait "$game_pid"
          '
          cat /tmp/godot-boot.log
          if grep -E "$ERROR_PATTERN" /tmp/godot-boot.log; then
            echo "ERROR: Rendered main-scene smoke test found startup errors."
            exit 1
          fi
          grep -q "STARTUP CHECK OK: active gameplay camera found." /tmp/godot-boot.log
          grep -q "STARTUP CHECK OK: mobile controls found." /tmp/godot-boot.log
          test -s build/android/veil_circuit_boot.png

      - name: Upload boot screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veil-circuit-boot-screenshot
          path: build/android/veil_circuit_boot.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Android Debug APK
        run: |
          set -e
          # Use a monotonic version code so later APKs can update earlier debug installs.
          sed -i "0,/^version\/code=.*/s//version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          mkdir -p build/android
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          set -o pipefail
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --export-debug "Android Debug" build/android/veil_circuit_debug.apk 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error|Cannot get class|Parent path .* vanished|ERROR: Failed loading|Invalid assignment of property|_create_mesh_array|NULL MESH INSTANCE|Failed to retrieve non-existent singleton|valid InputEvent object|No loader found for resource|SHADER ERROR|Shader compilation failed" /tmp/godot-export.log; then
            echo "ERROR: Godot export reported scene, resource, or script errors."
            exit 1
          fi
          if [ ! -f build/android/veil_circuit_debug.apk ]; then
            echo "ERROR: APK not created. Godot export failed."
            exit 1
          fi
          if [ ! -s build/android/veil_circuit_debug.apk ]; then
            echo "ERROR: APK file is empty"
            exit 1
          fi
          ls -la build/android/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-circuit-debug-apk
          path: build/android/veil_circuit_debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Report APK info
        run: |
          echo "APK size: $(stat -c%s build/android/veil_circuit_debug.apk) bytes"
          echo "APK SHA256: $(sha256sum build/android/veil_circuit_debug.apk)"