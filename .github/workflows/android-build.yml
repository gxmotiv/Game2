name: Build Android Debug APK

on:
  push:
    branches: [kilo/airy-chime-uvv]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3.stable"
  GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
  GODOT_TEMPLATES_URL: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
  ANDROID_SDK_VERSION: "11076708"
  ANDROID_SDK_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget curl libfontconfig1 libx11-6 libxext6 libxrender1 libxi6 libxtst6 libgl1

      - name: Download and install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q "${{ env.ANDROID_SDK_URL }}" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android licenses and install SDK packages
        run: |
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Download Godot 4.3 stable
        run: |
          mkdir -p $HOME/godot
          cd $HOME/godot
          wget -q "${{ env.GODOT_URL }}" -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          echo "$HOME/godot" >> $GITHUB_PATH

      - name: Download Godot export templates
        run: |
          cd $HOME/godot
          wget -q "${{ env.GODOT_TEMPLATES_URL }}" -O templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz -d $HOME/.local/share/godot/export_templates/4.3.stable
          # Fix: tpz extracts to a "templates" subdirectory, move files up
          if [ -d "$HOME/.local/share/godot/export_templates/4.3.stable/templates" ]; then
            mv $HOME/.local/share/godot/export_templates/4.3.stable/templates/* $HOME/.local/share/godot/export_templates/4.3.stable/
            rmdir $HOME/.local/share/godot/export_templates/4.3.stable/templates
          fi
          ls -la $HOME/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Godot editor settings
        run: |
          mkdir -p $HOME/.config/godot
          cat > $HOME/.config/godot/editor_settings-4.tres << 'EOF'
[gd_resource type="EditorSettings" load_steps=2 format=3]

[ext_resource type="Script" path="res://scripts/editor_settings.gd" id="1"]

[resource]
export/android/adb = ""
export/android/jdk_path = "/usr/lib/jvm/java-21-openjdk-amd64"
export/android/sdk_path = "/home/runner/android-sdk"
run/main_scene = "res://scenes/main/main.tscn"
EOF

      - name: Verify project structure
        run: |
          ls -la /workspace/app/
          ls -la /workspace/app/assets/textures/

      - name: Build Android Debug APK
        run: |
          cd /workspace/app
          godot --headless --export-release "Android Debug" build/android/veil_circuit_debug.apk
          ls -la build/android/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-circuit-debug-apk
          path: build/android/veil_circuit_debug.apk
          retention-days: 30

      - name: Report APK info
        if: always()
        run: |
          if [ -f build/android/veil_circuit_debug.apk ]; then
            echo "APK size: $(stat -c%s build/android/veil_circuit_debug.apk) bytes"
            echo "APK SHA256: $(sha256sum build/android/veil_circuit_debug.apk)"
          else
            echo "APK not found - build may have failed"
            exit 1
          fi