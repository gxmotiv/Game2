name: Build Android Debug APK

on:
  push:
    branches: [kilo/airy-chime-uvv]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3.stable"
  GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
  GODOT_TEMPLATES_URL: "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
  ANDROID_SDK_VERSION: "11076708"
  ANDROID_SDK_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          # No Gradle cache - this is a Godot project, not a Gradle project

      - name: Verify project files
        run: |
          ls -la project.godot export_presets.cfg
          ls -la assets/textures/icon.png

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget curl libfontconfig1 libx11-6 libxext6 libxrender1 libxi6 libxtst6 libgl1

      - name: Download and install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q "${{ env.ANDROID_SDK_URL }}" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android licenses and install SDK packages
        run: |
          # Disable pipefail only for license acceptance to handle broken pipe from 'yes'
          set +o pipefail
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          LICENSE_EXIT=${PIPESTATUS[1]}
          set -o pipefail
          if [ $LICENSE_EXIT -ne 0 ]; then
            echo "ERROR: License acceptance failed with exit code $LICENSE_EXIT"
            exit 1
          fi
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Download Godot 4.3 stable
        run: |
          mkdir -p $HOME/godot
          cd $HOME/godot
          wget -q "${{ env.GODOT_URL }}" -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          echo "$HOME/godot" >> $GITHUB_PATH

      - name: Download and install Godot export templates
        run: |
          cd $HOME/godot
          wget -q "${{ env.GODOT_TEMPLATES_URL }}" -O templates.tpz
          mkdir -p $HOME/.local/share/godot/export_templates/4.3.stable
          unzip -q templates.tpz -d $HOME/.local/share/godot/export_templates/4.3.stable
          # Fix: tpz extracts to a "templates" subdirectory, move files up
          if [ -d "$HOME/.local/share/godot/export_templates/4.3.stable/templates" ]; then
            mv $HOME/.local/share/godot/export_templates/4.3.stable/templates/* $HOME/.local/share/godot/export_templates/4.3.stable/
            rmdir $HOME/.local/share/godot/export_templates/4.3.stable/templates
          fi
          # Verify required Android templates exist
          if [ ! -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk" ] || [ ! -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_release.apk" ]; then
            echo "ERROR: Required Android export templates not found"
            ls -la $HOME/.local/share/godot/export_templates/4.3.stable/
            exit 1
          fi
          echo "Export templates verified"

      - name: Configure Godot editor settings
        run: |
          mkdir -p $HOME/.config/godot
          # Use JAVA_HOME from setup-java (points to Temurin JDK)
          if [ -z "$JAVA_HOME" ] || [ ! -f "$JAVA_HOME/bin/java" ]; then
            echo "ERROR: JAVA_HOME not set or invalid"
            exit 1
          fi
          {
            echo '[gd_resource type="EditorSettings" load_steps=1 format=3]'
            echo ''
            echo '[resource]'
            echo 'export/android/adb = ""'
            echo "export/android/jdk_path = \"$JAVA_HOME\""
            echo "export/android/sdk_path = \"$HOME/android-sdk\""
            echo 'run/main_scene = "res://scenes/main/main.tscn"'
          } > $HOME/.config/godot/editor_settings-4.tres

      - name: Validate export preset
        run: |
          cat > /tmp/validate_export.gd <<'ENDOFSCRIPT'
extends SceneTree

func _init():
    # Load the export preset
    var preset = ProjectSettings.get_value("export/presets/0")
    if not preset:
        print("ERROR: No export preset found at index 0")
        quit(1)
    
    # Check preset properties
    print("Preset name: ", preset.get("name", "unknown"))
    print("Preset platform: ", preset.get("platform", "unknown"))
    
    # Check package settings
    var pkg_name = preset.get("package/unique_name", "")
    var pkg_display = preset.get("package/name", "")
    print("Package unique_name: ", pkg_name)
    print("Package display name: ", pkg_display)
    
    if pkg_name.empty():
        print("ERROR: package/unique_name is empty")
    else:
        # Validate package name format
        if not pkg_name.match("^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"):
            print("ERROR: Invalid package name format: ", pkg_name)
    
    if pkg_display.empty():
        print("WARNING: package/name (display name) is empty")
    
    # Check Android-specific settings
    var min_sdk = preset.get("android/min_sdk", 0)
    var target_sdk = preset.get("android/target_sdk", 0)
    var version_code = preset.get("android/version_code", 0)
    var version_name = preset.get("android/version_name", "")
    
    print("Min SDK: ", min_sdk)
    print("Target SDK: ", target_sdk)
    print("Version code: ", version_code)
    print("Version name: ", version_name)
    
    if min_sdk < 1:
        print("ERROR: min_sdk must be >= 1")
    if target_sdk < 1:
        print("ERROR: target_sdk must be >= 1")
    if target_sdk < min_sdk:
        print("ERROR: target_sdk must be >= min_sdk")
    if version_code <= 0:
        print("ERROR: version_code must be > 0")
    if version_name.empty():
        print("ERROR: version_name is empty")
    
    # Check keystore
    var debug_keystore = preset.get("android/keystore/debug", "")
    var release_keystore = preset.get("android/keystore/release", "")
    print("Debug keystore: '", debug_keystore, "'")
    print("Release keystore: '", release_keystore, "'")
    
    # Check permissions
    var perms = preset.get("android/permissions", [])
    print("Permissions: ", perms)
    
    # Check editor settings for SDK/JDK paths
    var sdk_path = EditorSettings.get_setting("export/android/sdk_path", "")
    var jdk_path = EditorSettings.get_setting("export/android/jdk_path", "")
    print("SDK path from editor settings: ", sdk_path)
    print("JDK path from editor settings: ", jdk_path)
    
    if sdk_path.empty():
        print("WARNING: export/android/sdk_path not set in editor settings")
    if jdk_path.empty():
        print("WARNING: export/android/jdk_path not set in editor settings")
    
    # Try to validate export preset using Godot's export API
    var export = EditorExport.get_singleton()
    if export:
        var preset_list = export.get_export_presets()
        print("Available presets: ", preset_list.size())
        for i in range(preset_list.size()):
            var p = preset_list[i]
            print("Preset ", i, ": ", p.get("name", "unknown"), " platform: ", p.get("platform", "unknown"))
        
        # Try to get the Android export platform
        var android_export = export.get_export_platform("Android")
        if android_export:
            print("Android export platform found")
            # Get the preset index for "Android Debug"
            var preset_idx = -1
            for i in range(preset_list.size()):
                if preset_list[i].get("name") == "Android Debug":
                    preset_idx = i
                    break
            
            if preset_idx >= 0:
                print("Found Android Debug preset at index ", preset_idx)
                # Validate the preset
                var errors = android_export.validate_export_preset(preset_idx)
                if errors.size() > 0:
                    print("VALIDATION ERRORS:")
                    for err in errors:
                        print("  - ", err)
                else:
                    print("Preset validation passed!")
            else:
                print("ERROR: Android Debug preset not found")
        else:
            print("ERROR: Android export platform not found")
    
    quit(0)
ENDOFSCRIPT
          
          # Run validation script
          godot --headless --script /tmp/validate_export.gd 2>&1

      - name: Build Android Debug APK
        run: |
          set -e
          # Export with debug-level logging to capture configuration errors
          export GODOT_ANDROID_SDK_PATH="$HOME/android-sdk"
          export GODOT_ANDROID_JDK_PATH="$JAVA_HOME"
          godot --headless --log-level=debug --export-release "Android Debug" build/android/veil_circuit_debug.apk --editor-settings $HOME/.config/godot/editor_settings-4.tres 2>&1
          # Verify APK was created and is non-empty
          if [ ! -f build/android/veil_circuit_debug.apk ]; then
            echo "ERROR: APK not created. Godot export failed."
            exit 1
          fi
          if [ ! -s build/android/veil_circuit_debug.apk ]; then
            echo "ERROR: APK file is empty"
            exit 1
          fi
          ls -la build/android/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: veil-circuit-debug-apk
          path: build/android/veil_circuit_debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Report APK info
        run: |
          echo "APK size: $(stat -c%s build/android/veil_circuit_debug.apk) bytes"
          echo "APK SHA256: $(sha256sum build/android/veil_circuit_debug.apk)"